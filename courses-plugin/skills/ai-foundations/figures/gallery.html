<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Foundations Figures</title>
<style>
:root { --scale:1; color-scheme:light dark; }
body { margin:0; padding:16px 24px; background:#e9e7e1; color:#23262b; font:17px -apple-system, Helvetica, sans-serif; }
header { position:sticky; top:0; background:#e9e7e1; padding:10px 0; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
header strong { margin-right:auto; }
input { width:min(280px, 60vw); }
figure { margin:22px 0; overflow-x:auto; }
img { display:block; width:calc(var(--w) * var(--scale) * 1px); }
figcaption { margin-top:6px; color:#667080; font-size:15px; }
</style></head><body>
<header><strong>AI Foundations figures</strong>
<label for="size">Size</label><input id="size" type="range" min="50" max="300" step="10" value="100">
<output id="value" for="size">100%</output></header>
<figure><a href="neuron.svg"><img src="neuron.svg" alt="neuron.svg" style="--w:960"></a><figcaption>neuron.svg</figcaption></figure><figure><a href="activation-functions.svg"><img src="activation-functions.svg" alt="activation-functions.svg" style="--w:980"></a><figcaption>activation-functions.svg</figcaption></figure><figure><a href="mlp.svg"><img src="mlp.svg" alt="mlp.svg" style="--w:960"></a><figcaption>mlp.svg</figcaption></figure><figure><a href="loss-landscape.svg"><img src="loss-landscape.svg" alt="loss-landscape.svg" style="--w:900"></a><figcaption>loss-landscape.svg</figcaption></figure><figure><a href="computational-graph.svg"><img src="computational-graph.svg" alt="computational-graph.svg" style="--w:1000"></a><figcaption>computational-graph.svg</figcaption></figure><figure><a href="learning-curves.svg"><img src="learning-curves.svg" alt="learning-curves.svg" style="--w:860"></a><figcaption>learning-curves.svg</figcaption></figure><figure><a href="dropout.svg"><img src="dropout.svg" alt="dropout.svg" style="--w:980"></a><figcaption>dropout.svg</figcaption></figure><figure><a href="rgb-channels.svg"><img src="rgb-channels.svg" alt="rgb-channels.svg" style="--w:800"></a><figcaption>rgb-channels.svg</figcaption></figure><figure><a href="convolution.svg"><img src="convolution.svg" alt="convolution.svg" style="--w:900"></a><figcaption>convolution.svg</figcaption></figure><figure><a href="stride-padding-pooling.svg"><img src="stride-padding-pooling.svg" alt="stride-padding-pooling.svg" style="--w:1000"></a><figcaption>stride-padding-pooling.svg</figcaption></figure><figure><a href="lenet-5.svg"><img src="lenet-5.svg" alt="lenet-5.svg" style="--w:1000"></a><figcaption>lenet-5.svg</figcaption></figure><figure><a href="receptive-field.svg"><img src="receptive-field.svg" alt="receptive-field.svg" style="--w:860"></a><figcaption>receptive-field.svg</figcaption></figure><figure><a href="alexnet-vgg.svg"><img src="alexnet-vgg.svg" alt="alexnet-vgg.svg" style="--w:1000"></a><figcaption>alexnet-vgg.svg</figcaption></figure><figure><a href="inception.svg"><img src="inception.svg" alt="inception.svg" style="--w:980"></a><figcaption>inception.svg</figcaption></figure><figure><a href="resnet-block.svg"><img src="resnet-block.svg" alt="resnet-block.svg" style="--w:760"></a><figcaption>resnet-block.svg</figcaption></figure><figure><a href="positional-encoding.svg"><img src="positional-encoding.svg" alt="positional-encoding.svg" style="--w:880"></a><figcaption>positional-encoding.svg</figcaption></figure><figure><a href="transformer.svg"><img src="transformer.svg" alt="transformer.svg" style="--w:930"></a><figcaption>transformer.svg</figcaption></figure><figure><a href="diffusion-chain.svg"><img src="diffusion-chain.svg" alt="diffusion-chain.svg" style="--w:960"></a><figcaption>diffusion-chain.svg</figcaption></figure>
<script>
const size = document.getElementById("size"), value = document.getElementById("value");
function apply(percent) {
  size.value = percent;
  value.textContent = percent + "%";
  document.documentElement.style.setProperty("--scale", percent / 100);
}
try { const saved = localStorage.getItem("figure-scale"); if (saved) apply(saved); } catch (e) {}
size.addEventListener("input", () => {
  apply(size.value);
  try { localStorage.setItem("figure-scale", size.value); } catch (e) {}
});
</script>
</body></html>
