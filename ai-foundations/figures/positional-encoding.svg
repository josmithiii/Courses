<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" width="880" height="530" style="font-family:Helvetica, Arial, sans-serif">
<rect width="880" height="530" rx="10" fill="#ffffff"/>
<text x="24" y="42" font-size="26" font-weight="bold" fill="#23262b">Positional encoding</text>
<rect x="788" y="16" width="72" height="36" rx="18" fill="#f1f3f6" stroke="#aab2bd"/>
<text x="824" y="41" font-size="21" fill="#667080" text-anchor="middle">Plot</text>
<image x="110" y="74" width="576" height="288" style="image-rendering:pixelated" preserveAspectRatio="none" href="data:image/png;base64,"/>
<rect x="110" y="74" width="576" height="288" fill="none" stroke="#aab2bd"/>
<text x="100" y="83.25" font-size="21" fill="#667080" text-anchor="end" font-weight="normal">0</text>
<text x="100" y="227.25" font-size="21" fill="#667080" text-anchor="end" font-weight="normal">32</text>
<text x="100" y="366.75" font-size="21" fill="#667080" text-anchor="end" font-weight="normal">63</text>
<text x="112.25" y="388" font-size="21" fill="#667080" text-anchor="middle" font-weight="normal">0</text>
<text x="256.25" y="388" font-size="21" fill="#667080" text-anchor="middle" font-weight="normal">32</text>
<text x="400.25" y="388" font-size="21" fill="#667080" text-anchor="middle" font-weight="normal">64</text>
<text x="544.25" y="388" font-size="21" fill="#667080" text-anchor="middle" font-weight="normal">96</text>
<text x="683.75" y="388" font-size="21" fill="#667080" text-anchor="middle" font-weight="normal">127</text>
<text x="398" y="418" font-size="21" fill="#23262b" text-anchor="middle" font-weight="normal">embedding dimension</text>
<text transform="translate(44 218) rotate(-90)" font-size="21" fill="#23262b" text-anchor="middle">position in the sequence</text>
<image x="716" y="74" width="20" height="288" style="image-rendering:pixelated" preserveAspectRatio="none" href="data:image/png;base64,"/>
<rect x="716" y="74" width="20" height="288" fill="none" stroke="#aab2bd"/>
<text x="744" y="90" font-size="21" fill="#667080" text-anchor="start" font-weight="normal">+1</text>
<text x="744" y="225" font-size="21" fill="#667080" text-anchor="start" font-weight="normal">0</text>
<text x="744" y="362" font-size="21" fill="#667080" text-anchor="start" font-weight="normal">-1</text>
<text x="24" y="487" font-size="21" fill="#667080">The axes carry the data. Each row is the fingerprint of one position.</text>
<text x="24" y="514" font-size="21" fill="#667080">PE(pos, 2i) = sin(pos / 10000^(2i/d)); PE(pos, 2i+1) = cos(same); d = 128.</text>
</svg>
