<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" style="font-family:Helvetica, Arial, sans-serif">
<rect width="960" height="420" rx="10" fill="#ffffff"/>
<text x="24" y="42" font-size="26" font-weight="bold" fill="#23262b">Artificial neuron</text>
<rect x="857.5" y="16" width="82.5" height="36" rx="18" fill="#f1f3f6" stroke="#aab2bd"/>
<text x="898.75" y="41" font-size="21" fill="#667080" text-anchor="middle">Graph</text>
<line x1="136" y1="125" x2="382.96" y2="192.5" stroke="#d0701a" stroke-width="2"/>
<circle cx="110" cy="125" r="26" fill="#d6f0ec" stroke="#1f8a7d" stroke-width="1.8"/>
<text x="108" y="132" font-size="24" fill="#23262b" text-anchor="middle" font-weight="normal">x<tspan dy="4" font-size="21">1</tspan></text>
<text x="262" y="147.2" font-size="24" fill="#d0701a" text-anchor="middle" font-weight="normal">w<tspan dy="4" font-size="21">1</tspan></text>
<line x1="136" y1="215" x2="382.96" y2="215" stroke="#d0701a" stroke-width="2"/>
<circle cx="110" cy="215" r="26" fill="#d6f0ec" stroke="#1f8a7d" stroke-width="1.8"/>
<text x="108" y="222" font-size="24" fill="#23262b" text-anchor="middle" font-weight="normal">x<tspan dy="4" font-size="21">2</tspan></text>
<text x="262" y="203" font-size="24" fill="#d0701a" text-anchor="middle" font-weight="normal">w<tspan dy="4" font-size="21">2</tspan></text>
<line x1="136" y1="305" x2="382.96" y2="237.5" stroke="#d0701a" stroke-width="2"/>
<circle cx="110" cy="305" r="26" fill="#d6f0ec" stroke="#1f8a7d" stroke-width="1.8"/>
<text x="108" y="312" font-size="24" fill="#23262b" text-anchor="middle" font-weight="normal">x<tspan dy="4" font-size="21">3</tspan></text>
<text x="262" y="258.8" font-size="24" fill="#d0701a" text-anchor="middle" font-weight="normal">w<tspan dy="4" font-size="21">3</tspan></text>
<rect x="358" y="120" width="382" height="190" rx="10" fill="none" stroke="#aab2bd" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="549" y="106" font-size="21" fill="#667080" text-anchor="middle" font-weight="normal">one neuron: two steps</text>
<circle cx="440" cy="215" r="62" fill="#fbe7d3" stroke="#d0701a" stroke-width="1.8"/>
<text x="440" y="222" font-size="21" fill="#23262b" text-anchor="middle" font-weight="normal">sum + b</text>
<line x1="504" y1="215" x2="564" y2="215" stroke="#667080" stroke-width="1.8"/>
<polygon points="574,215 564.869,210.922 564.869,219.078" fill="#667080"/>
<rect x="575" y="187" width="150" height="56" rx="5" fill="#e8edf2" stroke="#5b6b80" stroke-width="1.5"/>
<text x="650" y="222" font-size="21" fill="#23262b" text-anchor="middle" font-weight="normal">activation</text>
<line x1="727" y1="215" x2="792" y2="215" stroke="#667080" stroke-width="1.8"/>
<polygon points="802,215 792.869,210.922 792.869,219.078" fill="#667080"/>
<circle cx="830" cy="215" r="26" fill="#ecdff4" stroke="#7a4ca3" stroke-width="1.8"/>
<text x="830" y="223" font-size="24" fill="#23262b" text-anchor="middle" font-weight="normal">y</text>
<text x="24" y="404" font-size="21" fill="#667080">The usual single circle hides two steps: a weighted sum, then a bend.</text>
</svg>
